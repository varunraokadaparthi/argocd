# The hub's connection to Vault. ClusterSecretStore rather than SecretStore so
# any namespace on the hub can reference it without one store per namespace.
#
# Vault is not in this cluster -- it is a container on the shared podman
# network -- so the address is its container name, resolvable from pods via
# podman's aardvark-dns.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: http://vault:8200
      path: demo
      # kv-v2 keeps data under a /data/ prefix; telling ESO the version lets
      # it build the path rather than making every ExternalSecret spell it out.
      version: v2
      auth:
        tokenSecretRef:
          name: vault-token
          key: token
          # ClusterSecretStore is cluster-scoped, so the namespace holding the
          # credential has to be named explicitly.
          namespace: external-secrets
