# Vault access for platform credentials, kept apart from the application one.
#
# The `vault` ClusterSecretStore is usable from any namespace on the hub,
# which is right for app secrets and wrong for this: anyone able to create an
# ExternalSecret could otherwise read the GitHub App key and gain push access
# to the repository. Hence a second store, scoped two ways --
#
#   conditions   only argocd and promoter-system may reference it
#   policy       its Vault token can read platform/* and nothing else
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-platform
spec:
  conditions:
    - namespaces:
        - argocd
        - promoter-system

  provider:
    vault:
      server: http://vault:8200
      path: platform
      version: v2
      auth:
        tokenSecretRef:
          name: vault-platform-token
          key: token
          namespace: external-secrets
