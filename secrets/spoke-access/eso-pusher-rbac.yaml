# Applied to each SPOKE, in the app namespace, so the hub's ESO can write
# Secrets there via PushSecret.
#
# Deliberately narrow: a Role, not a ClusterRole, scoped to Secrets in one
# namespace. The hub already holds cluster-admin on these clusters through
# argocd-manager; this is a separate, much smaller identity so that the secret
# path is not riding on Argo CD's credentials.
#
# Apply with `-n <app-namespace>` -- the namespace is intentionally not set
# here so the same file serves demo-int and demo-prod.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-pusher
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-pusher
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-pusher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-pusher
subjects:
  - kind: ServiceAccount
    name: eso-pusher
---
# ESO validates its own permissions before pushing by creating a
# SelfSubjectRulesReview, which is cluster-scoped and so cannot be granted by
# the Role above.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eso-pusher-selfsubjectrulesreview
rules:
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: v1
kind: Secret
metadata:
  name: eso-pusher-token
  annotations:
    kubernetes.io/service-account.name: eso-pusher
type: kubernetes.io/service-account-token
