apiVersion: batch/v1
kind: Job
metadata:
  generateName: hydr-
  labels: {t30098: hydr}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/inject-sync-info: revision
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: {t30098: hydr}
    spec:
      restartPolicy: Never
      containers:
      - name: c
        image: docker.io/alpine/git:latest
        command: [sh, -c]
        args:
        - echo "INJECTED=$SYNC_REVISION"; sleep 40; echo "HYDRATED_HEAD_NOW=$(git ls-remote https://github.com/varunraokadaparthi/argocd.git refs/heads/sync-rev-30098/env/int | cut -f1)"
        env:
        - name: SYNC_REVISION
          valueFrom: {fieldRef: {fieldPath: "metadata.annotations['argocd.argoproj.io/sync-revision']"}}
