apiVersion: v1
kind: ConfigMap
metadata:
  name: not-a-hook
  annotations: {argocd.argoproj.io/inject-sync-info: revision}
data: {version: "1"}
---
apiVersion: v1
kind: Pod
metadata:
  generateName: syncpod-
  labels: {t30098: syncpod}
  annotations: {argocd.argoproj.io/hook: Sync, argocd.argoproj.io/inject-sync-info: revision}
spec:
  restartPolicy: Never
  containers:
  - name: c
    image: docker.io/library/alpine:3.22
    command: [sh, -c, 'echo "INJECTED=$SYNC_REVISION"']
    env:
    - name: SYNC_REVISION
      valueFrom: {fieldRef: {fieldPath: "metadata.annotations['argocd.argoproj.io/sync-revision']"}}
