apiVersion: batch/v1
kind: Job
metadata:
  generateName: presync-
  labels: {t30098: presync}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/inject-sync-info: revision
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: {t30098: presync}
    spec:
      restartPolicy: Never
      containers:
      - name: c
        image: docker.io/alpine/git:latest
        command: [sh, -c]
        args:
        - echo "INJECTED=$SYNC_REVISION"
        env:
        - name: SYNC_REVISION
          valueFrom: {fieldRef: {fieldPath: "metadata.annotations['argocd.argoproj.io/sync-revision']"}}
---
