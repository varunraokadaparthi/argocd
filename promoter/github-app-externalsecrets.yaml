# The GitHub App credential, sourced from Vault rather than from a file.
#
# Both consumers get their Secret built by ESO from platform/github-app, so
# the .pem only has to exist on disk long enough to be loaded into Vault once.
# Rotating the key becomes a `vault kv put` -- no re-running the bootstrap and
# no key sitting in a shell history or a laptop's Downloads folder.
#
# If Vault goes away these Secrets keep their last value; ESO stops refreshing
# rather than deleting, so Argo CD and Promoter carry on.

---
# Promoter reads the private key through its ScmProvider's secretRef.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-app
  namespace: promoter-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-platform
    kind: ClusterSecretStore
  target:
    name: github-app
    creationPolicy: Owner
  data:
    - secretKey: githubAppPrivateKey
      remoteRef:
        key: github-app
        property: privateKey

---
# Argo CD's repository credential. Needs more than the key: the label is what
# makes Argo CD treat the Secret as repo credentials at all, and the url ties
# it to a specific repository.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-argocd-demo
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-platform
    kind: ClusterSecretStore
  target:
    name: repo-argocd-demo
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: https://github.com/varunraokadaparthi/argocd.git
        githubAppID: "{{ .appID }}"
        githubAppInstallationID: "{{ .installationID }}"
        githubAppPrivateKey: "{{ .privateKey }}"
  data:
    - secretKey: appID
      remoteRef:
        key: github-app
        property: appID
    - secretKey: installationID
      remoteRef:
        key: github-app
        property: installationID
    - secretKey: privateKey
      remoteRef:
        key: github-app
        property: privateKey
