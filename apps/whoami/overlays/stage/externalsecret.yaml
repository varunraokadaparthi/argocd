# The hub pulls the secret from Vault into demo-stage.
#
# Only the hub does this. The spokes receive the same value by PushSecret from
# here, so no Vault credential ever reaches int or prod.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: whoami-config
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: whoami-config
    creationPolicy: Owner
  data:
    - secretKey: greeting
      remoteRef:
        # Path is relative to the store's `demo` mount, and ESO adds the
        # kv-v2 /data/ segment itself.
        key: whoami
        property: greeting
