# Replicates the Secret the hub pulled from Vault into the spoke clusters.
#
# PushSecret normally writes to a secrets backend; with ESO's kubernetes
# provider the "backend" is another cluster's namespace. The stores it
# references are created by secrets-bootstrap.sh, because each carries a
# bearer token for its spoke and so cannot live in git.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: whoami-config
spec:
  refreshInterval: 1m
  # Replace so a rotated value in Vault actually overwrites the copy on the
  # spoke rather than being skipped as already-present.
  updatePolicy: Replace
  # Leave the Secret behind on the spoke if this PushSecret is removed;
  # deleting it would take the app down on a cluster we may not be looking at.
  deletionPolicy: None
  selector:
    secret:
      name: whoami-config
  secretStoreRefs:
    - name: spoke-int
      kind: SecretStore
    - name: spoke-prod
      kind: SecretStore
  data:
    - match:
        secretKey: greeting
        remoteRef:
          remoteKey: whoami-config
          property: greeting
