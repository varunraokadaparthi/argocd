apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-2028-stage

resources:
  - ../../base

secretGenerator:
  - name: whoami-config
    literals:
      - greeting=sdcicd-2028-stage
    options:
      disableNameSuffixHash: true

labels:
  - pairs:
      app.kubernetes.io/instance: whoami2028-stage
      env: stage
    includeSelectors: false
