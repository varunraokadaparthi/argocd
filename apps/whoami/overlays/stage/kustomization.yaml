apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-stage

resources:
  - ../../base
  # Only the stage overlay carries these: the hub is the one cluster that
  # talks to Vault, and it pushes the result to the spokes.
  - externalsecret.yaml
  - pushsecret.yaml

labels:
  - pairs:
      app.kubernetes.io/instance: whoami-stage
      env: stage
    includeSelectors: false

replicas:
  - name: whoami
    count: 2
