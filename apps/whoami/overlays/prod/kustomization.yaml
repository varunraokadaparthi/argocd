apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-prod

resources:
  - ../../base
  - pdb.yaml

labels:
  - pairs:
      app.kubernetes.io/instance: whoami-prod
      env: prod
    includeSelectors: false

replicas:
  - name: whoami
    count: 3

# Only prod gets spreading and a disruption budget, so the overlays differ in
# something more interesting than a replica count.
patches:
  - path: spread.yaml
    target:
      kind: Deployment
      name: whoami
