apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-2028-int

resources:
  - ../../base

secretGenerator:
  - name: whoami-config
    literals:
      - greeting=sdcicd-2028-int
    options:
      disableNameSuffixHash: true

labels:
  - pairs:
      app.kubernetes.io/instance: whoami2028-int
      env: int
    includeSelectors: false

images:
  - name: traefik/whoami
    newTag: v0.0.0-does-not-exist
