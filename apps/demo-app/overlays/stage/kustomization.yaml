apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: demo-app
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2

  - target:
      kind: ConfigMap
      name: demo-app-config
    patch: |
      - op: replace
        path: /data/GREETING
        value: "Hello from STAGE environment"
      - op: replace
        path: /data/ENV
        value: "stage"

commonAnnotations:
  environment: stage
