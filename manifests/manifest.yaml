apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: web
    app.kubernetes.io/instance: whoami-stage
    app.kubernetes.io/name: whoami
    app.kubernetes.io/part-of: demo
    env: stage
  name: whoami
  namespace: demo-stage
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: whoami
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: whoami-stage
    env: stage
  name: whoami-preview
  namespace: demo-stage
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: whoami
  type: ClusterIP
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  labels:
    app.kubernetes.io/component: web
    app.kubernetes.io/instance: whoami-stage
    app.kubernetes.io/name: whoami
    app.kubernetes.io/part-of: demo
    env: stage
  name: http-health-check
  namespace: demo-stage
spec:
  args:
    - name: service-name
  metrics:
    - count: 3
      failureLimit: 1
      interval: 10s
      name: health-check
      provider:
        job:
          spec:
            backoffLimit: 1
            template:
              spec:
                containers:
                  - command:
                      - /bin/sh
                      - -c
                      - |
                        # The Job's stdout is the metric value, so print the
                        # status code and nothing else.
                        curl -o /dev/null -s -w "%{http_code}" \
                          --connect-timeout 5 --max-time 10 \
                          "http://${SERVICE_NAME}/"
                    env:
                      - name: SERVICE_NAME
                        value: '{{args.service-name}}'
                    image: docker.io/curlimages/curl:latest
                    name: curl
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL
                      readOnlyRootFilesystem: true
                      runAsNonRoot: true
                      runAsUser: 65532
                restartPolicy: Never
      successCondition: result == "200"
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  annotations:
    secret.reloader.stakater.com/reload: whoami-config
  labels:
    app.kubernetes.io/component: web
    app.kubernetes.io/instance: whoami-stage
    app.kubernetes.io/name: whoami
    app.kubernetes.io/part-of: demo
    env: stage
  name: whoami
  namespace: demo-stage
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: whoami
  strategy:
    blueGreen:
      activeService: whoami
      autoPromotionEnabled: true
      autoPromotionSeconds: 30
      prePromotionAnalysis:
        args:
          - name: service-name
            value: whoami-preview
        templates:
          - templateName: http-health-check
      previewService: whoami-preview
      scaleDownDelaySeconds: 30
  template:
    metadata:
      labels:
        app.kubernetes.io/name: whoami
    spec:
      containers:
        - args:
            - --port=8080
            - --name=$(WHOAMI_NAME)
          env:
            - name: WHOAMI_NAME
              valueFrom:
                secretKeyRef:
                  key: greeting
                  name: whoami-config
          image: traefik/whoami:v1.12.0
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          name: whoami
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 5m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
      securityContext:
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  labels:
    app.kubernetes.io/component: web
    app.kubernetes.io/instance: whoami-stage
    app.kubernetes.io/name: whoami
    app.kubernetes.io/part-of: demo
    env: stage
  name: whoami-config
  namespace: demo-stage
spec:
  data:
    - remoteRef:
        key: whoami
        property: greeting
      secretKey: greeting
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    creationPolicy: Owner
    name: whoami-config
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  labels:
    app.kubernetes.io/component: web
    app.kubernetes.io/instance: whoami-stage
    app.kubernetes.io/name: whoami
    app.kubernetes.io/part-of: demo
    env: stage
  name: whoami-config
  namespace: demo-stage
spec:
  data:
    - match:
        remoteRef:
          property: greeting
          remoteKey: whoami-config
        secretKey: greeting
  deletionPolicy: None
  refreshInterval: 1m
  secretStoreRefs:
    - kind: SecretStore
      name: spoke-int
    - kind: SecretStore
      name: spoke-prod
  selector:
    secret:
      name: whoami-config
  updatePolicy: Replace
