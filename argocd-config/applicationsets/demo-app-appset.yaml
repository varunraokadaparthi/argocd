apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: demo-app
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: env
              operator: In
              values:
                - int
                - stage
                - prod
  template:
    metadata:
      name: 'demo-app-{{.metadata.labels.env}}'
    spec:
      project: apps
      source:
        repoURL: '{{.metadata.annotations.git_repo_url}}'
        targetRevision: HEAD
        path: 'apps/demo-app/overlays/{{.metadata.labels.env}}'
      destination:
        server: '{{.server}}'
        namespace: demo-app
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
        retry:
          limit: 3
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m0s
