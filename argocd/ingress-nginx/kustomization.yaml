# Ingress controller for the hub, pinned. The kind provider manifest runs the
# controller on the node labelled ingress-ready=true with hostPorts 80/443,
# which stage.yaml maps to localhost:8080 / localhost:8443.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.15.1/deploy/static/provider/kind/deploy.yaml
