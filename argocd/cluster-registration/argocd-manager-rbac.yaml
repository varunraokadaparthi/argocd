# Applied to each SPOKE cluster, not the hub.
#
# This is the half of cluster registration that can live in git: it grants the
# hub's Argo CD a identity on the spoke, but contains no credential. The other
# half -- a Secret on the hub holding this ServiceAccount's bearer token --
# is generated by register-clusters.sh and deliberately never committed.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-manager
  namespace: kube-system
---
# Full access, matching what `argocd cluster add` grants by default. Argo CD
# has to be able to create arbitrary kinds for an Application to be able to
# deploy them. Narrow this per-tenant in a real cluster; the AppProject is the
# more practical place to draw that line.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-manager-role
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
  - nonResourceURLs: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-manager-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-manager-role
subjects:
  - kind: ServiceAccount
    name: argocd-manager
    namespace: kube-system
---
# Kubernetes 1.24+ no longer auto-creates a token Secret for a ServiceAccount.
# Requesting one explicitly gives a long-lived token, which is what the hub
# needs -- a projected volume token would expire and cannot be read from here.
apiVersion: v1
kind: Secret
metadata:
  name: argocd-manager-token
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: argocd-manager
type: kubernetes.io/service-account-token
