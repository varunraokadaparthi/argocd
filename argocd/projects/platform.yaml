# Cluster infrastructure, as opposed to application workloads.
#
# A separate project from `demo` because the two need genuinely different
# permissions: platform components install cluster-scoped RBAC and CRDs and
# live outside the demo-* namespaces, and the demo tenant should not be able
# to do any of that. Widening `demo` to fit would have handed the application
# tenant ClusterRole and CRD creation, which is the thing an AppProject
# exists to prevent.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Cluster infrastructure components

  sourceRepos:
    - https://github.com/varunraokadaparthi/argocd.git
    # Helm chart repositories count as sources too.
    - https://stakater.github.io/stakater-charts
    - https://argoproj.github.io/argo-helm

  destinations:
    - name: in-cluster
      namespace: reloader
    - name: int
      namespace: reloader
    - name: prod
      namespace: reloader
    - name: in-cluster
      namespace: argo-rollouts
    - name: int
      namespace: argo-rollouts
    - name: prod
      namespace: argo-rollouts

  # Reloader watches every namespace and Rollouts ships its own CRDs, so both
  # need cluster-scoped resources the application tenant must not have.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
