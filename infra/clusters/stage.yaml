# Hub cluster. Runs ArgoCD; manages itself plus the int and prod spokes.
#
# Extra port mappings expose an ingress controller on the host so the ArgoCD UI
# is reachable at localhost:8080 / localhost:8443 without a port-forward.
# kind has no cloud provider, so type: LoadBalancer would stay <pending>.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: stage

networking:
  # Distinct from the spokes so the clusters can be peered later without
  # renumbering. kind defaults (10.244.0.0/16 / 10.96.0.0/16) would collide.
  podSubnet: "10.240.0.0/16"
  serviceSubnet: "10.241.0.0/16"

nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
